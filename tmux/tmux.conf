# ~/.tmux.conf

# ── General ───────────────────────────────────────────────────────────────
set -g default-terminal "tmux-256color"          # proper colors
set -ga terminal-overrides ",*256col*:Tc"        # truecolor support
set -g history-limit 50000                        # bigger scrollback
set -g display-time 2000                          # messages stay 2s
set -sg escape-time 0                             # no delay for esc (vim)
set -g focus-events on
set -g mouse on                                   # mouse scroll/select/resize
setw -g aggressive-resize on

# Start windows and panes at 1, renumber on close
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# ── Prefix: Ctrl-a (easier than Ctrl-b) ───────────────────────────────────
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Reload config
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# ── Vim-style pane navigation (prefix + h/j/k/l) ──────────────────────────
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Vim-style pane resizing (prefix + H/J/K/L, repeatable)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ── Splits: keep current path, more intuitive keys ────────────────────────
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# New window in current path
bind c new-window -c "#{pane_current_path}"

# Vim-style window switching (prefix + n/p already exist; add Tab cycling)
bind -r C-h previous-window
bind -r C-l next-window

# ── Copy mode with vim keys ───────────────────────────────────────────────
setw -g mode-keys vi
bind v copy-mode
bind -T copy-mode-vi v   send -X begin-selection
bind -T copy-mode-vi y   send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel
# System clipboard integration -- whichever tool this machine has.
# Falls back to the tmux-internal buffer binding above if none are found.
if-shell "command -v xclip"  "bind -T copy-mode-vi y send -X copy-pipe-and-cancel 'xclip -selection clipboard -in'"
if-shell "command -v wl-copy" "bind -T copy-mode-vi y send -X copy-pipe-and-cancel 'wl-copy'"
if-shell "command -v pbcopy" "bind -T copy-mode-vi y send -X copy-pipe-and-cancel 'pbcopy'"

# ── Status bar ────────────────────────────────────────────────────────────
set -g status-interval 5
set -g status-position bottom
set -g status-justify left

set -g status-style "bg=default fg=white"
set -g status-left "#[fg=green,bold] #S #[default]"
set -g status-left-length 30
set -g status-right "#[fg=cyan]%Y-%m-%d #[fg=yellow]%H:%M "

setw -g window-status-current-style "fg=black,bg=green,bold"
setw -g window-status-current-format " #I:#W "
setw -g window-status-format " #I:#W "

# Highlight active pane border
set -g pane-border-style "fg=brightblack"
set -g pane-active-border-style "fg=green"
